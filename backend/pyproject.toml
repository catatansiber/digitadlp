[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitadlp"
version = "0.1.0"
description = "DLP engine that detects and redacts personal data in Indonesian government documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pymupdf",
    "python-docx",
    "pytesseract",
    "pillow",
    "openpyxl",
    "sqlalchemy>=2",
    "alembic",
    "argon2-cffi",
    "cryptography",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["digitadlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
